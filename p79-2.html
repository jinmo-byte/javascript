<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
      crossorigin="anonymous"
    ></script>
    <script>
      var expression = "";

      function add(character) {
        expression = expression + character;
        document.getElementById("display").value = expression;
      }
      function compute() {
        expression = eval(expression);
        document.getElementById("display").value = expression;
      }
      function clearDisplay() {
        expression = expression.slice(0, expression.length - 1);
        document.getElementById("display").value = expression;
      }
      function allClearDisplay() {
        expression = "";
        document.getElementById("display").value = "";
      }
    </script>
  </head>
<body>
    <form>
      <i>Calc</i><input class="form-control" id="display" value="" size="30"  />
      <br />
      <input type="button" value=" 7 " onclick="add('7')" class="btn-text theme-warning"/>
      <input type="button" value=" 8 " onclick="add('8')" class="btn-text theme-warning"/>
      <input type="button" value=" 9 " onclick="add('9')" class="btn-text theme-warning"/>
      <input type="button" value=" / " onclick="add('/')" class="btn-text theme-info"/>
      <br />
      <input type="button" value=" 4 " onclick="add('4')" class="btn-text theme-warning"/>
      <input type="button" value=" 5 " onclick="add('5')" class="btn-text theme-warning"/>
      <input type="button" value=" 6 " onclick="add('6')" class="btn-text theme-warning"/>
      <input type="button" value=" * " onclick="add('*')" class="btn-text theme-info"/>
      <br />
      <input type="button" value=" 1 " onclick="add('1')" class="btn-text theme-warning"/>
      <input type="button" value=" 2 " onclick="add('2')" class="btn-text theme-warning"/>
      <input type="button" value=" 3 " onclick="add('3')" class="btn-text theme-warning"/>
      <input type="button" value=" - " onclick="add('-')" class="btn-text theme-info"/>
      <br />
      <input type="button" value=" 0 " onclick="add('0')" class="btn-text theme-warning"/>
      <input type="button" value=" + " onclick="add('+')" class="btn-text theme-info"/>
      <input type="button" value=" ( " onclick="add('(')" class="btn-text theme-info"/>
      <input type="button" value=" ) " onclick="add(')')" class="btn-text theme-info"/>
      <br />

      <input type="button" value="  C  " onclick="clearDisplay()" class="btn-subtle theme-danger btn-xs"/>
      <input type="button" value=" AC " onclick="allClearDisplay()" class="btn-subtle theme-danger btn-xs"/>
      &nbsp&nbsp&nbsp&nbsp
      <input type="button" value="Enter" onclick="compute()" class="btn-subtle theme-accent btn-xs"/>
    </form>
  </body>
</html>
