<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <img id="image" src="snow1.jpg" width="120" height="100">
        <script>
            //#1
            var clickCount = 0;
            function changeImage() {
              document.getElementById("image").src = "snow2.jpg";
              clickCount++;
              // console.log(clickCount);
              if (clickCount % 2 == 0) {
                document.getElementById("image").src = "snow1.jpg";
              }
            }
          </script>
        <input type="button" onclick="changeImage()" value="click!"/>
    </body>
</html>
