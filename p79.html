<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
        <script>
            var expression = "";
        
            function add(character) {
                expression = expression + character;
                document.getElementById("display").value = expression;
            }
            function compute() {
                expression = "(" + expression + ")";
                document.getElementById("display").value = eval(expression);
            }
            function clearDisplay() {
                expression = "";
                document.getElementById("display").value = 0;
            }
        </script>
    </head>
    <body>
        <form>
            display <input id="display" class="theme-primary btn-outline" value="0" size="30">
            <br>
            <input type="button" class="theme-danger btn-solid btn-lg" value="7" onclick="add('7')">
            <input type="button" class="theme-danger btn-solid btn-lg" value="8" onclick="add('8')">
            <input type="button" class="theme-danger btn-solid btn-lg" value="9" onclick="add('9')">
            <input type="button" class="theme-danger btn-outline btn-lg" value="/" onclick="add('/')">
            <br>
            <input type="button" class="theme-warning btn-solid btn-lg" value="4" onclick="add('4')">
            <input type="button" class="theme-warning btn-solid btn-lg" value="5" onclick="add('5')">
            <input type="button" class="theme-warning btn-solid btn-lg" value="6" onclick="add('6')">
            <input type="button" class="theme-warning btn-outline btn-lg" value="*" onclick="add('*')">
            <br>
            <input type="button" class="theme-accent btn-solid btn-lg" value="1" onclick="add('1')">
            <input type="button" class="theme-accent btn-solid btn-lg" value="2" onclick="add('2')">
            <input type="button" class="theme-accent btn-solid btn-lg" value="3" onclick="add('3')">
            <input type="button" class="theme-accent btn-outline btn-lg" value="-" onclick="add('-')">
            <br>
            <input type="button" class="theme-secondary btn-solid btn-lg" value="0" onclick="add('0')">
            <input type="button" class="theme-secondary btn-outline btn-lg" value="+" onclick="add('+')">
            <br>
            <input type="button" class="btn" value="Clear"  onclick="clearDisplay()">
            <input type="button" class="theme-success btn-solid" value="Enter" name="enter" onclick="compute()">
        </form>
    </body>
</html>
